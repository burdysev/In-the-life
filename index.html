<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>1 из 8 миллиардов</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;overscroll-behavior:none;color:#e8e8f0;}
:root{--bg:#0a0a12;--card:#141420;--card2:#1c1c2e;
  --border:rgba(255,255,255,0.07);--border-hi:rgba(255,255,255,0.16);
  --text:#e8e8f0;--muted:#7a7a95;--dim:#4a4a60;
  --gold:#ffc440;--green:#34d399;--red:#f87171;
  --blue:#60a5fa;--pink:#ec4899;--purple:#a855f7;--cyan:#22d3ee;}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);max-width:500px;margin:0 auto;}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;animation:fadeIn .4s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ===== SETUP ===== */
#setupScreen{
  background:radial-gradient(circle at 50% 0%, rgba(96,165,250,.12), transparent 50%),#07070d;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);
  overflow-y:auto;align-items:center;}
.setup-content{width:100%;max-width:400px;margin:auto;padding:10px 0;}
.setup-header{text-align:center;margin-bottom:20px;}
.setup-icon{font-size:52px;line-height:1;margin-bottom:8px;display:block;
  filter:drop-shadow(0 0 30px rgba(96,165,250,.4));}
.setup-title{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.15;
  background:linear-gradient(135deg,#a8d4ff,#fff 40%,#c8b0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;}
.setup-subtitle{font-size:11px;color:var(--muted);line-height:1.5;}
.setup-section{background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.setup-label{font-size:9px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;font-weight:800;margin-bottom:6px;}
.setup-options{display:flex;gap:5px;}
.setup-opt{flex:1;padding:9px 3px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:9px;color:var(--muted);
  font-family:inherit;font-size:10px;font-weight:800;cursor:pointer;
  transition:all .15s;display:flex;flex-direction:column;align-items:center;
  gap:2px;text-align:center;}
.setup-opt .em{font-size:15px;}
.setup-opt.active{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.6);
  color:#a8d4ff;box-shadow:0 0 14px rgba(96,165,250,.2);}
.setup-opt:active{transform:scale(.96);}
.setup-birth{width:100%;padding:16px;border:none;border-radius:14px;
  font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;
  background:linear-gradient(180deg,#a8d4ff,#60a5fa);color:#04101e;
  box-shadow:0 8px 30px rgba(96,165,250,.4);
  transition:transform .1s;margin-top:6px;}
.setup-birth:active{transform:scale(.97);}

/* ===== LIFE ===== */
#lifeScreen{background:var(--bg);}
.life-top{padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;
  background:rgba(10,10,18,.96);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;}
.top-id{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.life-flag{font-size:18px;flex-shrink:0;}
.life-nm{flex:1;min-width:0;}
.life-name{font-size:12px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.life-meta{font-size:8px;color:var(--muted);margin-top:1px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-age{text-align:right;flex-shrink:0;}
.life-age{font-size:20px;font-weight:900;color:var(--gold);line-height:1;}
.life-age-lbl{font-size:8px;color:var(--muted);font-weight:700;margin-top:1px;}

.stats-line{display:flex;gap:3px;margin-bottom:4px;}
.stat-chip{flex:1;display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.03);border-radius:5px;padding:2px 4px;
  border:1px solid var(--border);}
.stat-chip .em{font-size:8px;}
.stat-chip .bar{flex:1;height:3px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden;}
.stat-chip .fill{height:100%;transform-origin:left;transition:transform .4s;border-radius:2px;}
.stat-chip .fill.h{background:linear-gradient(90deg,#f87171,#fb923c);}
.stat-chip .fill.s{background:linear-gradient(90deg,#fbbf24,#f59e0b);}
.stat-chip .fill.k{background:linear-gradient(90deg,#60a5fa,#3b82f6);}
.stat-chip .fill.r{background:linear-gradient(90deg,#ec4899,#db2777);}
.stat-chip .v{font-size:7px;font-weight:800;color:var(--muted);min-width:12px;
  text-align:right;font-variant-numeric:tabular-nums;}

.info-line{display:flex;align-items:center;justify-content:space-between;
  font-size:9px;color:var(--muted);font-weight:700;padding:0 2px;gap:4px;}
.info-line .status-tag{padding:2px 7px;border-radius:6px;
  background:rgba(255,255,255,.06);font-weight:900;color:var(--text);
  font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:60%;}
.info-line .money{color:var(--gold);font-weight:900;font-variant-numeric:tabular-nums;
  white-space:nowrap;}

/* Tabs */
.life-tabs{display:flex;background:rgba(10,10,18,.96);border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:9;}
.life-tab{flex:1;padding:8px 4px;border:none;background:transparent;
  color:var(--muted);font-family:inherit;font-size:10px;font-weight:800;
  cursor:pointer;transition:color .15s;position:relative;display:flex;
  flex-direction:column;align-items:center;gap:1px;}
.life-tab .em{font-size:14px;}
.life-tab.active{color:var(--blue);}
.life-tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;
  height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);}

.life-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px;
  -webkit-overflow-scrolling:touch;}
.tab-pane{display:none;}
.tab-pane.active{display:block;animation:fadeIn .25s;}

/* Log */
.log-item{padding:5px 8px;border-radius:7px;font-size:11px;line-height:1.4;
  color:#c8c8d8;margin-bottom:3px;border-left:2px solid var(--dim);
  background:rgba(255,255,255,.02);animation:logIn .25s ease;}
@keyframes logIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
.log-item .age{font-size:8px;font-weight:900;color:var(--muted);margin-bottom:1px;
  text-transform:uppercase;letter-spacing:.04em;}
.log-item.good{border-left-color:var(--green);background:rgba(52,211,153,.05);}
.log-item.bad{border-left-color:var(--red);background:rgba(248,113,113,.05);}
.log-item.event{border-left-color:var(--purple);background:rgba(168,85,247,.06);}
.log-item.milestone{border-left-color:var(--gold);background:rgba(255,196,64,.07);}
.log-item.death{border-left-color:var(--red);background:rgba(248,113,113,.1);font-weight:700;}

/* Empty state */
.empty-state{text-align:center;padding:30px 16px;color:var(--muted);
  font-size:12px;line-height:1.5;}
.empty-state .em{font-size:32px;display:block;margin-bottom:8px;opacity:.5;}

/* Relation / Career panels */
.panel-card{background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-bottom:8px;}
.panel-title{font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;font-weight:800;margin-bottom:8px;display:flex;
  align-items:center;gap:5px;}

.partner-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.partner-avatar{width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:linear-gradient(135deg,var(--pc,#ec4899),rgba(0,0,0,.4));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);}
.partner-info{flex:1;min-width:0;}
.partner-name{font-size:14px;font-weight:900;}
.partner-sub{font-size:10px;color:var(--muted);margin-top:1px;font-weight:600;}

.stat-row{display:flex;justify-content:space-between;padding:4px 0;
  font-size:11px;border-bottom:1px solid rgba(255,255,255,.05);}
.stat-row:last-child{border-bottom:none;}
.stat-row .k{color:var(--muted);font-weight:600;}
.stat-row .v{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums;}

.love-bar{height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;
  margin:8px 0;border:1px solid var(--border);}
.love-fill{height:100%;background:linear-gradient(90deg,#ec4899,#f43f5e);
  transform-origin:left;transition:transform .4s;border-radius:3px;}

.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.action-btn{padding:10px 6px;border:none;border-radius:10px;font-family:inherit;
  font-size:11px;font-weight:800;cursor:pointer;transition:transform .1s;
  display:flex;flex-direction:column;align-items:center;gap:2px;}
.action-btn .em{font-size:15px;}
.action-btn.primary{background:linear-gradient(180deg,#f9a8d4,#ec4899);color:#2d0716;}
.action-btn.secondary{background:rgba(255,255,255,.06);color:var(--text);
  border:1px solid var(--border-hi);}
.action-btn.danger{background:rgba(248,113,113,.15);color:#fca5a5;
  border:1px solid rgba(248,113,113,.3);}
.action-btn.success{background:rgba(52,211,153,.15);color:#6ee7b7;
  border:1px solid rgba(52,211,153,.3);}
.action-btn:active{transform:scale(.96);}
.action-btn:disabled{opacity:.35;cursor:not-allowed;}

/* Career specific */
.career-option{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .15s;
  font-family:inherit;color:var(--text);width:100%;text-align:left;}
.career-option:active{transform:scale(.98);background:rgba(96,165,250,.1);
  border-color:rgba(96,165,250,.4);}
.career-option.current{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4);}
.career-option:disabled{opacity:.4;cursor:not-allowed;}
.career-option .co-em{font-size:20px;flex-shrink:0;}
.career-option .co-info{flex:1;min-width:0;}
.career-option .co-name{font-size:12px;font-weight:800;}
.career-option .co-desc{font-size:9px;color:var(--muted);margin-top:2px;}
.career-option .co-income{font-size:11px;font-weight:900;color:var(--gold);
  font-variant-numeric:tabular-nums;flex-shrink:0;}

/* Bottom */
.life-bottom{padding:5px 10px calc(env(safe-area-inset-bottom,0px) + 6px);
  background:rgba(10,10,18,.96);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);flex-shrink:0;}
.focus-row{display:flex;gap:3px;margin-bottom:5px;}
.focus-btn{flex:1;padding:6px 2px;border:1px solid var(--border);border-radius:9px;
  background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;
  font-size:7px;font-weight:800;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:1px;}
.focus-btn .em{font-size:13px;}
.focus-btn.active{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.6);
  color:#a8d4ff;}
.focus-btn:active{transform:scale(.94);}
.focus-btn:disabled{opacity:.3;}

.controls-row{display:flex;gap:4px;}
.btn-next{flex:1;padding:11px;border:none;border-radius:11px;
  font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;
  background:linear-gradient(180deg,#a8d4ff,#60a5fa);color:#04101e;
  box-shadow:0 4px 18px rgba(96,165,250,.35);
  transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:4px;}
.btn-next:active{transform:scale(.97);}
.btn-next:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn-ctrl{padding:11px 10px;border:1px solid var(--border-hi);border-radius:11px;
  background:rgba(255,255,255,.06);color:var(--text);font-size:13px;
  cursor:pointer;transition:transform .1s;display:flex;align-items:center;
  justify-content:center;min-width:40px;}
.btn-ctrl:active{transform:scale(.94);background:rgba(255,255,255,.12);}
.btn-ctrl.active{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.5);
  color:#8fffc0;}

.speed-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(10,10,18,.95);color:var(--gold);font-size:12px;font-weight:900;
  padding:6px 14px;border-radius:10px;border:1px solid var(--gold);
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:20;}
.speed-indicator.show{opacity:1;}

/* Modals */
.modal-overlay{position:absolute;inset:0;background:rgba(5,5,10,.9);
  backdrop-filter:blur(10px);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;padding:16px;animation:fadeIn .25s;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);}
.modal-card{background:linear-gradient(165deg,#1a1a2e,#0e0e1a);
  border:1px solid rgba(168,85,247,.4);border-radius:20px;
  padding:20px 18px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  animation:slideUp .35s cubic-bezier(.2,1,.3,1);
  max-height:85vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.modal-icon{font-size:22px;}
.modal-title{font-size:10px;font-weight:900;color:var(--purple);
  text-transform:uppercase;letter-spacing:.06em;}
.modal-text{font-size:13px;line-height:1.5;color:#d8d8e8;margin-bottom:14px;}
.modal-choices{display:flex;flex-direction:column;gap:7px;}
.choice-btn{width:100%;padding:12px 14px;text-align:left;
  background:rgba(255,255,255,.05);border:1px solid var(--border-hi);
  border-radius:12px;color:var(--text);font-family:inherit;font-size:12px;
  font-weight:600;line-height:1.4;cursor:pointer;transition:all .15s;}
.choice-btn:active{transform:scale(.98);background:rgba(168,85,247,.18);border-color:var(--purple);}

/* Education choice */
.edu-card{background:rgba(255,255,255,.04);border:1px solid var(--border-hi);
  border-radius:12px;padding:12px;margin-bottom:6px;cursor:pointer;
  transition:all .15s;width:100%;text-align:left;font-family:inherit;color:var(--text);}
.edu-card:active{transform:scale(.98);background:rgba(96,165,250,.12);
  border-color:rgba(96,165,250,.4);}
.edu-card:disabled{opacity:.4;cursor:not-allowed;}
.edu-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.edu-em{font-size:20px;}
.edu-name{font-size:13px;font-weight:800;}
.edu-cost{font-size:10px;font-weight:800;color:var(--red);margin-left:auto;}
.edu-details{font-size:10px;color:var(--muted);line-height:1.4;}

/* Partner choice */
.partner-choice{background:rgba(255,255,255,.04);border:1px solid var(--border-hi);
  border-radius:12px;padding:12px;margin-bottom:6px;cursor:pointer;
  transition:all .15s;width:100%;text-align:left;font-family:inherit;color:var(--text);}
.partner-choice:active{transform:scale(.98);background:rgba(236,72,153,.1);
  border-color:rgba(236,72,153,.5);}
.pc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.pc-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:linear-gradient(135deg,var(--pc,#ec4899),rgba(0,0,0,.4));}
.pc-name{font-size:12px;font-weight:800;}
.pc-stats{display:flex;gap:6px;flex-wrap:wrap;font-size:9px;color:var(--muted);font-weight:700;}
.pc-stats .st{color:var(--gold);}

/* Question modal */
.question-card{background:linear-gradient(165deg,#1a1a2e,#0e0e1a);
  border:1px solid rgba(255,196,64,.4);border-radius:20px;padding:20px 18px;
  width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.question-label{font-size:10px;font-weight:900;color:var(--gold);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.question-text{font-size:15px;font-weight:700;line-height:1.4;color:#f0f0f8;margin-bottom:12px;}
.question-input{width:100%;min-height:70px;padding:10px;border-radius:10px;
  background:rgba(0,0,0,.3);border:1px solid var(--border-hi);color:var(--text);
  font-family:inherit;font-size:12px;line-height:1.5;resize:none;outline:none;}
.question-input:focus{border-color:var(--gold);}
.question-actions{display:flex;gap:6px;margin-top:10px;}
.btn-skip{flex:1;padding:10px;border:1px solid var(--border-hi);border-radius:10px;
  background:rgba(255,255,255,.05);color:var(--muted);font-family:inherit;
  font-size:12px;font-weight:800;cursor:pointer;}
.btn-submit{flex:2;padding:10px;border:none;border-radius:10px;
  background:linear-gradient(180deg,#ffd97a,#ffb940);color:#1a0a05;
  font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;}

/* Death */
#deathScreen{background:radial-gradient(circle at 50% 20%, rgba(248,113,113,.08), transparent 50%),#06060c;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);
  overflow-y:auto;}
.death-content{width:100%;max-width:400px;margin:auto;text-align:center;padding:8px 0;}
.death-icon{font-size:52px;margin-bottom:6px;display:block;
  filter:drop-shadow(0 0 30px rgba(248,113,113,.4));}
.death-title{font-size:20px;font-weight:900;color:#f0f0f8;margin-bottom:3px;}
.death-sub{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:14px;}
.death-summary{background:linear-gradient(165deg,#16162a,#0c0c16);
  border:1px solid var(--border-hi);border-radius:16px;padding:14px;
  margin-bottom:12px;text-align:left;}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;}
.sum-row:last-child{border-bottom:none;}
.sum-row .k{color:var(--muted);font-weight:600;}
.sum-row .v{font-weight:800;color:#f0f0f8;font-variant-numeric:tabular-nums;}
.sum-row .v.gold{color:var(--gold);}
.final-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;}
.fs-box{background:rgba(255,255,255,.04);border-radius:9px;padding:7px;text-align:center;}
.fs-box .em{font-size:13px;}
.fs-box .n{font-size:14px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;}
.fs-box .l{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.compare-title{font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;font-weight:800;margin:14px 0 6px;text-align:left;}
.compare-item{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:9px;margin-bottom:4px;font-size:11px;text-align:left;}
.compare-item.me{background:rgba(255,196,64,.1);border-color:rgba(255,196,64,.4);}
.compare-item .cf{font-size:13px;flex-shrink:0;}
.compare-item .ci{flex:1;min-width:0;}
.compare-item .cn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.compare-item .cm{font-size:9px;color:var(--muted);margin-top:1px;}
.compare-item .ca{font-size:11px;font-weight:900;color:var(--gold);
  font-variant-numeric:tabular-nums;flex-shrink:0;}
.death-btns{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.death-btn{width:100%;padding:12px;border:none;border-radius:12px;
  font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;
  transition:transform .1s;}
.death-btn.primary{background:linear-gradient(180deg,#ffd97a,#ffb940);color:#1a0a05;}
.death-btn.secondary{background:rgba(255,255,255,.07);color:var(--text);
  border:1px solid var(--border-hi);}
.death-btn:active{transform:scale(.97);}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(20,20,32,.97);color:var(--text);padding:10px 18px;
  border-radius:12px;font-size:12px;font-weight:700;z-index:100;

function rand(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function fmtMoney(n){
  if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(1) + 'Б';
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + 'М';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(0) + 'К';
  return Math.round(n).toString();
}

function saveMeta(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch(e){}
}
function loadMeta(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    meta.totalLives = d.totalLives || 0;
    meta.totalBorn = d.totalBorn || 0;
    meta.totalDied = d.totalDied || 0;
  } catch(e){}
}

/* ============================================================
   PICKERS
   ============================================================ */
function pickCountry(){
  const key = settings.mode === 'births' ? 'br' : 'pop';
  const total = COUNTRIES.reduce((s, c) => s + c[key], 0);
  let r = Math.random() * total;
  for (const c of COUNTRIES){
    r -= c[key];
    if (r <= 0) return c;
  }
  return COUNTRIES[0];
}

function pickName(country, sex){
  const arr = NAMES[country.region] || NAMES.european;
  return pick(sex === 'm' ? arr.m : arr.f);
}

/* ============================================================
   PARTNER GENERATION
   ============================================================ */
function generatePartner(playerSex){
  const oppSex = playerSex === 'm' ? 'f' : 'm';
  const country = pickCountry();
  const name = pickName(country, oppSex);

  // Качества рандомно
  const beauty = rand(20, 100);
  const smart = rand(15, 100);
  const character = rand(20, 100);
  const incomeBase = country.gdp * (0.5 + Math.random() * 2);
  const income = Math.round(incomeBase);

  // Общий "балл" партнёра
  const score = beauty * 0.3 + smart * 0.25 + character * 0.3 + Math.min(100, income / 1000) * 0.15;

  return {
    name, country, sex: oppSex,
    beauty, smart, character, income,
    love: 40 + Math.floor(Math.random() * 30), // 40-70
    score,
    metAt: 0
  };
}

/* ============================================================
   LIFE CREATION
   ============================================================ */
function newLife(){
  const country = pickCountry();
  const sex = Math.random() < 0.5 ? 'm' : 'f';
  const name = pickName(country, sex);

  const wealthRoll = Math.random();
  let family;
  if (wealthRoll < 0.15) family = 'poor';
  else if (wealthRoll < 0.85) family = 'middle';
  else family = 'rich';

  const wealthBonus = family === 'rich' ? 15 : family === 'poor' ? -10 : 0;
  const countryBonus = (country.gdp / 50000 - 0.3) * 20;

  const healthBase = clamp(60 + countryBonus * 0.4 + wealthBonus * 0.5, 30, 90);
  const happinessBase = clamp(55 + countryBonus * 0.3 + wealthBonus * 0.4, 25, 90);
  const knowledgeBase = clamp(country.lit * 0.6 + wealthBonus * 0.5, 10, 80);
  const relationshipsBase = clamp(55 + wealthBonus * 0.3, 30, 85);

  const startMoney = family === 'rich' ? rand(50000, 200000) :
                     family === 'middle' ? rand(1000, 20000) :
                     rand(0, 1000);

  const maxAge = Math.round(country.le + rand(-8, 12));

  const siblings = [];
  for (let i = 0; i < 4; i++){
    const sc = pickCountry();
    const sSex = Math.random() < 0.5 ? 'm' : 'f';
    siblings.push({
      name: pickName(sc, sSex),
      country: sc,
      sex: sSex,
      maxAge: Math.round(sc.le + rand(-10, 15)),
      currentAge: 0,
      isDead: false,
      deathAge: null
    });
  }

  return {
    name, country, sex, family,
    age: 0,
    health: healthBase,
    happiness: happinessBase,
    knowledge: knowledgeBase,
    relationships: relationshipsBase,
    money: startMoney,
    focus: 'health',
    log: [],
    eventsSeen: new Set(),
    isDead: false,
    deathAge: 0,
    maxAge,
    siblings,
    milestones: {},
    // NEW:
    education: null,      // 'none'|'tech'|'univ'|'elite'|'abroad'|null
    eduYearsLeft: 0,
    eduDebt: 0,
    eduShown: false,      // показан ли выбор в 18
    career: null,         // 'unskilled'|'worker'|...
    careerYears: 0,
    careerIncome: 0,
    partner: null,
    married: false,
    children: 0,
    inPrison: false,
    prisonYearsLeft: 0
  };
}

/* ============================================================
   YEAR DURATION / SCHEDULE
   ============================================================ */
function calcYearDuration(life){
  return (settings.duration * 1000) / life.maxAge;
}

function scheduleYear(){
  if (yearTimer){ clearTimeout(yearTimer); yearTimer = null; }
  if (!G || G.isDead || paused) return;
  const dur = currentYearDuration / speedMultiplier;
  yearTimer = setTimeout(() => {
    if (!paused && G && !G.isDead) tickYear();
  }, dur);
}

/* ============================================================
   START
   ============================================================ */
function startGame(){
  G = newLife();
  meta.totalLives++;
  saveMeta();

  $('setupScreen').classList.remove('active');
  $('lifeScreen').classList.add('active');
  $('deathScreen').classList.remove('active');
  $('lifeLog').innerHTML = '';

  paused = false;
  speedMultiplier = 1;
  speedIndex = 0;
  $('speedBtn').textContent = '1×';
  $('pauseBtn').textContent = '⏸';
  $('pauseBtn').classList.remove('active');
  $('autoBtn').classList.remove('active');

  $('lifeFlag').textContent = G.country.f;
  $('lifeName').textContent = G.name;
  const famLabel = G.family === 'rich' ? 'богатая семья' : G.family === 'poor' ? 'бедная семья' : 'средний класс';
  $('lifeMeta').textContent = `${G.country.n} · ${famLabel}`;

  updateStats();
  updateAge();
  updateStatus();

  addLog(0, `Вы родились в ${G.country.n} (${G.country.f}). ${G.sex === 'm' ? 'Мальчик' : 'Девочка'}. ${famLabel}.`, 'milestone');

  updateFocusButtons();
  updateNextButton();
  switchTab('life');

  currentYearDuration = calcYearDuration(G);
  scheduleYear();
}

function endLife(){
  if (yearTimer){ clearTimeout(yearTimer); yearTimer = null; }
  if (autoTimer){ clearInterval(autoTimer); autoTimer = null; }
}

function findPartner(){
  paused = true;
  if (yearTimer) clearTimeout(yearTimer);

  // Generate 3 options
  const options = [];
  for (let i = 0; i < 3; i++){
    options.push(generatePartner(G.sex));
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-icon">💕</span>
        <span class="modal-title">Кандидаты</span>
      </div>
      <div class="modal-text">Выберите того, кто вам больше по душе:</div>
      <div class="modal-choices">
        ${options.map((p, i) => `
          <button class="partner-choice" data-i="${i}">
            <div class="pc-head">
              <div class="pc-av" style="--pc:${p.sex==='m'?'#60a5fa':'#ec4899'}">
                ${p.sex === 'm' ? '👨' : '👩'}
              </div>
              <div>
                <div class="pc-name">${p.name}</div>
                <div style="font-size:9px;color:var(--muted);margin-top:1px;">${p.country.f} ${p.country.n}</div>
              </div>
            </div>
            <div class="pc-stats">
              <span>💄 ${p.beauty}</span>
              <span>🧠 ${p.smart}</span>
              <span>😊 ${p.character}</span>
              <span class="st">💰 ${fmtMoney(p.income)}/год</span>
            </div>
          </button>
        `).join('')}
        <button class="choice-btn" id="cancelFind" style="text-align:center;margin-top:4px;">Отмена</button>
      </div>
    </div>
  `;
  document.getElementById('app').appendChild(overlay);

  overlay.querySelectorAll('.partner-choice').forEach((b, i) => {
    b.addEventListener('click', () => {
      G.partner = options[i];
      G.partner.metAt = G.age;
      G.happiness = clamp(G.happiness + 15, 0, 100);
      overlay.remove();
      addLog(G.age, `💕 Вы познакомились с ${G.partner.name} из ${G.partner.country.n}.`, 'good');
      paused = false;
      updateNextButton();
      renderRelations();
      scheduleYear();
    });
  });

  $('cancelFind').addEventListener('click', () => {
    overlay.remove();
    paused = false;
    updateNextButton();
    scheduleYear();
  });
}

function handleRelationAction(act){
  const p = G.partner;
  if (!p) return;

  if (act === 'date'){
    p.love = clamp(p.love + rand(5, 15), 0, 100);
    G.happiness = clamp(G.happiness + 5, 0, 100);
    G.money -= rand(500, 5000);
    addLog(G.age, `💐 Свидание с ${p.name}. Любовь: ${p.love}%`, 'good');
    updateStats();
    renderRelations();
    return;
  }

  if (act === 'marry'){
    if (p.love < 60){
      toast('❤️ Слишком мало любви — нужно минимум 60%');
      return;
    }
    G.married = true;
    G.money -= rand(20000, 100000);
    G.happiness = clamp(G.happiness + 15, 0, 100);
    addLog(G.age, `💍 Вы женились на ${p.name}!`, 'milestone');
    updateStats();
    renderRelations();
    return;
  }

  if (act === 'breakup'){
    if (G.married){
      G.money -= Math.floor(G.money * 0.3);
      addLog(G.age, `💔 Развод с ${p.name}. Потеряна часть имущества.`, 'bad');
    } else {
      addLog(G.age, `💔 Вы расстались с ${p.name}.`, 'bad');
    }
    G.happiness = clamp(G.happiness - 10, 0, 100);
    G.partner = null;
    G.married = false;
    renderRelations();
    updateStats();
  }
}

    b.addEventListener('click', () => {
      const id = b.dataset.car;
      G.career = id;
      G.careerYears = 0;
      G.careerIncome = CAREERS[id].baseIncome;
      addLog(G.age, `${CAREERS[id].em} Вы стали: ${CAREERS[id].name}.`, 'milestone');
      overlay.remove();
      paused = false;
      updateNextButton();
      updateStatus();
      renderCareer();
      scheduleYear();
    });
  });
}

/* ============================================================
   TICK YEAR
   ============================================================ */
function tickYear(){
  if (!G || G.isDead || paused) return;

  // Apply focus
  if (G.age >= 3){
    const f = FOCUSES[G.focus];
    if (f.eff.health) G.health += f.eff.health;
    if (f.eff.happiness) G.happiness += f.eff.happiness;
    if (f.eff.knowledge) G.knowledge += f.eff.knowledge;
    if (f.eff.relationships) G.relationships += f.eff.relationships;
    if (f.eff.money) G.money += f.eff.money;
  }

  // Education year
  if (G.eduYearsLeft > 0){
    G.eduYearsLeft--;
    G.knowledge += 4;
    if (G.eduYearsLeft === 0){
      addLog(G.age, `🎓 Образование завершено! Теперь можно выбрать карьеру.`, 'milestone');
    }
  }

  // Career income
  if (G.career && !G.inPrison){
    const c = CAREERS[G.career];
    const growthMult = 1 + G.careerYears * c.growth;
    let income = c.baseIncome * growthMult * (G.education ? EDUCATION[G.education].incomeMult : 1);

    if (c.special === 'entrepreneur'){
      // Random income
      const r = Math.random();
      if (r < 0.25){ income = 0; addLog(G.age, `💼 Бизнес прогорел в этом году.`, 'bad'); }
      else if (r > 0.9){ income *= 5; addLog(G.age, `💼 Бизнес выстрелил! ×5 доход.`, 'good'); }
    }

    if (c.special === 'criminal' && Math.random() < c.risk){
      // Prison
      G.inPrison = true;
      G.prisonYearsLeft = rand(3, 8);
      G.money = Math.floor(G.money * 0.3);
      addLog(G.age, `🚔 Поймали! ${G.prisonYearsLeft} лет тюрьмы. Деньги конфискованы.`, 'bad');
      G.happiness = clamp(G.happiness - 25, 0, 100);
      income = 0;
    }

    if (c.special === 'politics' && Math.random() < c.risk){
      addLog(G.age, `🏛️ Скандал в прессе. Репутация пострадала.`, 'bad');
      G.relationships = clamp(G.relationships - 15, 0, 100);
    }

    G.careerIncome = Math.max(0, income);
    G.money += income;
    G.careerYears++;
  }

  // Prison
  if (G.inPrison){
    G.prisonYearsLeft--;
    if (G.prisonYearsLeft <= 0){
      G.inPrison = false;
      G.career = null;
      G.careerYears = 0;
      G.careerIncome = 0;
      addLog(G.age, `🚪 Вы вышли из тюрьмы. Придётся начинать заново.`, 'milestone');
    } else {
      G.happiness = clamp(G.happiness - 3, 0, 100);
      G.health = clamp(G.health - 2, 0, 100);
    }
  }

  // Expenses
  let expenses = 5000 + G.age * 100;
  if (G.married) expenses += 15000;
  expenses += G.children * 25000;
  if (G.family === 'rich') expenses *= 1.5;
  G.money -= expenses;

  // Partner income + love decay
  if (G.partner){
    G.money += G.partner.income * 0.3;
    // Love decay
    let decay = 1 + (100 - G.partner.character) * 0.05;
    if (G.married) decay *= 1.5;
    G.partner.love = clamp(G.partner.love - decay, 0, 100);

    // Partner might leave
    if (G.partner.love < 15 && Math.random() < 0.3){
      addLog(G.age, `💔 ${G.partner.name} ушёл/ушла от вас.`, 'bad');
      G.partner = null;
      G.married = false;
      G.happiness = clamp(G.happiness - 20, 0, 100);
    }
  }

  // Children random birth
  if (G.married && G.children < 4 && G.age < 45 && Math.random() < 0.08){
    G.children++;
    G.happiness = clamp(G.happiness + 10, 0, 100);
    addLog(G.age, `👶 У вас родился ${G.children === 1 ? 'первый' : (G.children + '-й')} ребёнок!`, 'milestone');
  }

  // Aging
  if (G.age > 40) G.health -= (G.age - 40) * 0.08;
  if (G.age > 60) G.health -= (G.age - 60) * 0.15;

  G.health = clamp(G.health, 0, 100);
  G.happiness = clamp(G.happiness, 0, 100);
  G.knowledge = clamp(G.knowledge, 0, 100);
  G.relationships = clamp(G.relationships, 0, 100);

  G.age++;

  // Advance siblings
  for (const s of G.siblings){
    if (s.isDead) continue;
    s.currentAge++;
    let risk = 0.001;
    if (s.currentAge >= s.maxAge) risk = 1;
    else if (s.currentAge > 60) risk = 0.02 + (s.currentAge - 60) * 0.005;
    else if (s.currentAge > 40) risk = 0.004;
    if (Math.random() < risk){
      s.isDead = true;
      s.deathAge = s.currentAge;
    }
  }

  addLog(G.age, getAgeLog(G.age), 'good');

  // Show education choice at 18
  if (G.age === 18 && !G.education && !G.eduShown){
    G.eduShown = true;
    setTimeout(() => showEducationChoice(), 300);
  }

  // Milestone question
  if ([5, 15, 30, 50, 70].includes(G.age) && !G.milestones[G.age]){
    G.milestones[G.age] = true;
    setTimeout(() => showQuestion(G.age), 200);
  }

  if (checkDeath()){ die(); return; }

  maybeEvent();

  updateStats();
  updateAge();
  updateStatus();
  updateFocusButtons();
  updateNextButton();

  if (currentTab === 'relations') renderRelations();
  if (currentTab === 'career') renderCareer();

  scheduleYear();
}

/* ============================================================
   AGE LOG
   ============================================================ */
function getAgeLog(age){
  if (age <= 1) return pick(['Учитесь ходить.', 'Первый зуб.']);
  if (age <= 3) return pick(['Детский сад.', 'Любите мультики.']);
  if (age <= 5) return pick(['Играете во дворе.', 'Учитесь читать.']);
  if (age <= 10) return pick(['Школа. Домашка.', 'Нашли друга.', 'Лето, речка, велосипед.']);
  if (age <= 14) return pick(['Подростковый возраст.', 'Первые ссоры.']);
  if (age <= 18) return pick(['Экзамены. Нервы.', 'Выпускной.', 'Первая любовь.']);
  if (age <= 25) return pick(['Поиск себя.', 'Первые деньги.', 'Вечеринки.']);
  if (age <= 35) return pick(['Карьера набирает обороты.', 'Семейные заботы.', 'Кредиты и планы.']);
  if (age <= 45) return pick(['Стабильность.', 'Дети растут.', 'Планы на будущее.']);
  if (age <= 55) return pick(['Кризис среднего возраста.', 'Дети выросли.', 'Больше времени для себя.']);
  if (age <= 65) return pick(['Подготовка к пенсии.', 'Внуки.', 'Дача и огород.']);
  if (age <= 75) return pick(['Пенсия.', 'Здоровье — главное.', 'Долгие прогулки.']);
  return pick(['Каждый день — подарок.', 'Тишина и покой.', 'Внуки звонят по выходным.']);
}

/* ============================================================
   DEATH
   ============================================================ */
function checkDeath(){
  if (G.age >= G.maxAge) return true;

  const age = G.age;
  const im = G.country.im / 1000;
  let risk = 0;
  if (age === 0) risk = im * 2;
  else if (age < 5) risk = im * 0.5;
  else if (age < 15) risk = 0.001;
  else if (age < 40) risk = 0.0015 + (age - 15) * 0.0001;
  else if (age < 60) risk = 0.004 + (age - 40) * 0.0008;
  else if (age < 75) risk = 0.02 + (age - 60) * 0.003;
  else if (age < 85) risk = 0.08 + (age - 75) * 0.015;
  else risk = 0.25 + (age - 85) * 0.05;

  if (G.health < 30) risk *= 2;
  if (G.health < 15) risk *= 3;
  if (G.family === 'rich') risk *= 0.85;

  return Math.random() < risk;
}

function die(){
  G.isDead = true;
  G.deathAge = G.age;
  meta.totalDied++;
  saveMeta();
  endLife();
  addLog(G.age, `💀 Вы умерли в возрасте ${G.age} лет.`, 'death');
  setTimeout(showDeathScreen, 1200);
}

function showDeathScreen(){
  $('lifeScreen').classList.remove('active');
  $('deathScreen').classList.add('active');

  const icons = ['🕯️','🌹','🕊️','⚰️','🌙'];
  $('deathIcon').textContent = pick(icons);

  const year = 2026 - G.deathAge;
  const title = G.deathAge < 18 ? 'Жизнь оборвалась рано' :
    G.deathAge < 60 ? 'Жизнь прожита' : G.deathAge < 85 ? 'Долгая жизнь' : 'Долгожитель';
  $('deathTitle').textContent = title;
  $('deathSub').textContent = `${G.name}, ${G.country.f} ${G.country.n} · ${year} — 2026`;

  const status = getStatus(G.money, G.career, G.education);
  const eduName = G.education ? EDUCATION[G.education].name : 'без образования';
  const carName = G.career ? CAREERS[G.career].name : 'без карьеры';

  $('deathSummary').innerHTML = `
    <div class="sum-row"><span class="k">Возраст смерти</span><span class="v">${G.deathAge} лет</span></div>
    <div class="sum-row"><span class="k">Страна</span><span class="v">${G.country.f} ${G.country.n}</span></div>
    <div class="sum-row"><span class="k">Семья</span><span class="v">${G.family === 'rich' ? 'Богатая' : G.family === 'poor' ? 'Бедная' : 'Средний класс'}</span></div>
    <div class="sum-row"><span class="k">Образование</span><span class="v">${eduName}</span></div>
    <div class="sum-row"><span class="k">Карьера</span><span class="v">${carName}</span></div>
    <div class="sum-row"><span class="k">Дети</span><span class="v">${G.children}</span></div>
    <div class="sum-row"><span class="k">Статус</span><span class="v" style="color:${status.color}">${status.em} ${status.name}</span></div>
    <div class="sum-row"><span class="k">Накопления</span><span class="v gold">${fmtMoney(G.money)} ₽</span></div>
    <div class="final-stats">
      <div class="fs-box"><div class="em">❤️</div><div class="n">${Math.round(G.health)}</div><div class="l">Здоровье</div></div>
      <div class="fs-box"><div class="em">😊</div><div class="n">${Math.round(G.happiness)}</div><div class="l">Счастье</div></div>
      <div class="fs-box"><div class="em">📚</div><div class="n">${Math.round(G.knowledge)}</div><div class="l">Знания</div></div>
      <div class="fs-box"><div class="em">👥</div><div class="n">${Math.round(G.relationships)}</div><div class="l">Отношения</div></div>
    </div>
  `;

  let cmp = `
    <div class="compare-item me">
      <span class="cf">${G.country.f}</span>
      <div class="ci">
        <div class="cn">${G.name} (вы)</div>
        <div class="cm">${G.country.n} · ${status.name}</div>
      </div>
      <span class="ca">${G.deathAge}</span>
    </div>
  `;
  for (const s of G.siblings){
    const age = s.isDead ? s.deathAge : s.currentAge;
    cmp += `
      <div class="compare-item">
        <span class="cf">${s.country.f}</span>
        <div class="ci">
          <div class="cn">${s.name}${s.isDead ? ' †' : ''}</div>
          <div class="cm">${s.country.n}</div>
        </div>
        <span class="ca">${age}</span>
      </div>
    `;
  }
  $('compareList').innerHTML = cmp;
}

/* ============================================================
   LOG
   ============================================================ */
function addLog(age, text, type){
  if (!text) return;
  const logEl = $('lifeLog');
  const item = document.createElement('div');
  item.className = 'log-item' + (type ? ' ' + type : '');
  item.innerHTML = `<div class="age">${age} лет</div>${text}`;
  logEl.appendChild(item);
  logEl.scrollTop = logEl.scrollHeight;
}

/* ============================================================
   EVENTS
   ============================================================ */
function maybeEvent(){
  const eligible = EVENTS.filter(e =>
    G.age >= e.age[0] && G.age <= e.age[1] && !G.eventsSeen.has(e.title)
  );
  if (eligible.length === 0) return;
  if (Math.random() > 0.5) return;
  const event = pick(eligible);
  G.eventsSeen.add(event.title);
  showEventModal(event);
}

function showEventModal(event){
  paused = true;
  if (yearTimer) clearTimeout(yearTimer);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-icon">${event.icon}</span>
        <span class="modal-title">Событие · ${G.age} лет</span>
      </div>
      <div class="modal-text">${event.text}</div>
      <div class="modal-choices">
        ${event.choices.map((c, i) => `<button class="choice-btn" data-i="${i}">${c.text}</button>`).join('')}
      </div>
    </div>
  `;
  document.getElementById('app').appendChild(overlay);

  overlay.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const choice = event.choices[parseInt(btn.dataset.i)];
      overlay.remove();
      applyEventResult(event, choice);
      paused = false;
      updateNextButton();
      scheduleYear();
    });
  });
}

function applyEventResult(event, choice){
  const eff = choice.eff;
  if (eff.health) G.health += eff.health;
  if (eff.happiness) G.happiness += eff.happiness;
  if (eff.knowledge) G.knowledge += eff.knowledge;
  if (eff.relationships) G.relationships += eff.relationships;
  if (eff.money) G.money += eff.money;

  G.health = clamp(G.health, 0, 100);
  G.happiness = clamp(G.happiness, 0, 100);
  G.knowledge = clamp(G.knowledge, 0, 100);
  G.relationships = clamp(G.relationships, 0, 100);

  const isBad = (eff.health || 0) < 0 || (eff.happiness || 0) < 0;
  addLog(G.age, `${event.icon} ${event.text} → ${choice.res}`, isBad ? 'bad' : 'event');
  updateStats();
}

/* ============================================================
   QUESTION
   ============================================================ */
function showQuestion(age){
  paused = true;
  if (yearTimer) clearTimeout(yearTimer);

  const qs = {
    5: 'Что для вас сейчас самое важное?',
    15: 'Кем вы себя видите через 10 лет?',
    30: 'Что вы цените больше всего в жизни?',
    50: 'О чём вы жалеете и чему рады?',
    70: 'Что бы вы сказали себе в 20 лет?'
  };

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="question-card">
      <div class="question-label">Вам ${age} лет</div>
      <div class="question-text">${qs[age]}</div>
      <textarea class="question-input" id="qIn" placeholder="Напишите пару строк..." rows="3"></textarea>
      <div class="question-actions">
        <button class="btn-skip" id="qSkip">Пропустить</button>
        <button class="btn-submit" id="qSub">Записать</button>
      </div>
    </div>
  `;
  document.getElementById('app').appendChild(overlay);

  const inp = $('qIn');
  inp.focus();

  const finish = (text) => {
    overlay.remove();
    if (text && text.trim()){
      addLog(age, `📝 «${text.trim()}»`, 'milestone');
    } else {
      addLog(age, `🤔 Вы задумались о жизни...`, 'milestone');
    }
    paused = false;
    updateNextButton();
    scheduleYear();
  };

  $('qSkip').addEventListener('click', () => finish(null));
  $('qSub').addEventListener('click', () => finish(inp.value));
}

/* ============================================================
   UI BINDINGS
   ============================================================ */
$('birthBtn').addEventListener('click', () => startGame());

document.querySelectorAll('#eraOptions .setup-opt').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#eraOptions .setup-opt').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    settings.era = b.dataset.era;
  });
});

document.querySelectorAll('#modeOptions .setup-opt').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#modeOptions .setup-opt').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    settings.mode = b.dataset.mode;
  });
});

document.querySelectorAll('#durationOptions .setup-opt').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#durationOptions .setup-opt').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    settings.duration = parseInt(b.dataset.duration);
  });
});

document.querySelectorAll('.focus-btn').forEach(b => {
  b.addEventListener('click', () => {
    if (!G || G.age < 3) return;
    G.focus = b.dataset.focus;
    updateFocusButtons();
  });
});

$('nextYearBtn').addEventListener('click', () => {
  if (G && !G.isDead) tickYear();
});

$('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  $('pauseBtn').textContent = paused ? '▶' : '⏸';
  $('pauseBtn').classList.toggle('active', paused);
  updateNextButton();
  if (paused){
    if (yearTimer) clearTimeout(yearTimer);
  } else {
    scheduleYear();
  }
});

$('speedBtn').addEventListener('click', () => {
  speedIndex = (speedIndex + 1) % SPEEDS.length;
  speedMultiplier = SPEEDS[speedIndex];
  $('speedBtn').textContent = speedMultiplier + '×';
  const ind = $('speedIndicator');
  ind.textContent = speedMultiplier + '×';
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 800);
  if (!paused) scheduleYear();
});

$('autoBtn').addEventListener('click', () => {
  if (autoTimer){
    clearInterval(autoTimer);
    autoTimer = null;
    $('autoBtn').classList.remove('active');
    paused = false;
    updateNextButton();
    scheduleYear();
  } else {
    if (yearTimer) clearTimeout(yearTimer);
    paused = false;
    $('autoBtn').classList.add('active');
    autoTimer = setInterval(() => {
      if (G && !G.isDead && !paused) tickYear();
    }, 1200);
    updateNextButton();
  }
});

$('newLifeBtn').addEventListener('click', () => {
  $('deathScreen').classList.remove('active');
  $('setupScreen').classList.add('active');
});

$('homeBtn').addEventListener('click', () => {
  $('deathScreen').classList.remove('active');
  $('setupScreen').classList.add('active');
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadMeta();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ if (yearTimer) clearTimeout(yearTimer); }
    else if (G && !G.isDead && !paused) scheduleYear();
  });
}

init();

})();
</script>
